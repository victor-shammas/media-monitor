name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Media Monitor Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune files not served by the site
        run: |
          # data/monitor_state.json is the internal article DB (~60MB) and is never
          # fetched by index.html — the frontend only loads feeds/*.txt and
          # data/{hotspots,actors,radar}.json. Dropping it here roughly halves the
          # Pages artifact, which avoids the intermittent server-side
          # "Deployment failed, try again later" errors during syncing_files.
          # This only touches the ephemeral CI checkout; git history is unaffected.
          rm -f data/monitor_state.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub Pages intermittently rejects a deployment mid-sync with
      # "Deployment failed, try again later." — a transient server-side error.
      # Treat the first attempt as non-fatal, pause briefly, then retry once.
      # The job only fails if BOTH attempts fail.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pause before retrying a transient Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
